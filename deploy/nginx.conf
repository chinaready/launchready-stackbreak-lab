# Stack Break Lab — nginx config.
# Serves the repository root so that demo-relative paths (../public/assets, ../public/results)
# and root-absolute fetches (/results/latest.json, /demos/) all resolve consistently.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Friendly entry point.
    location = / {
        return 302 /demos/;
    }

    # Pretty results URL -> the viewer under public/. The data file /results/latest.json
    # and dated folders are still served directly because this matches the path exactly.
    location = /results {
        return 302 /public/results/;
    }
    location = /results/ {
        return 302 /public/results/;
    }

    # JSON should not be cached aggressively so the latest snapshot shows up.
    location ~* \.json$ {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Light hardening for a purely static, public site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
