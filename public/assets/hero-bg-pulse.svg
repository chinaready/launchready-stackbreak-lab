<!-- Hero illustration variant C "Pulse" — light canvas edition. Probe waveform:
     weekly measurement pulses with verdict-colored markers on a soft baseline. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" preserveAspectRatio="xMaxYMid meet">
  <defs>
    <linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#005BAC" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#005BAC" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <!-- baseline grid -->
  <g stroke="#DDE3EE" stroke-width="1">
    <line x1="40" y1="200" x2="880" y2="200" stroke-opacity="0.7"/>
    <line x1="40" y1="320" x2="880" y2="320"/>
    <line x1="40" y1="440" x2="880" y2="440" stroke-opacity="0.7"/>
    <line x1="40" y1="560" x2="880" y2="560"/>
  </g>
  <g fill="#005BAC" fill-opacity="0.18">
    <circle cx="60" cy="320" r="2.5"/><circle cx="60" cy="440" r="2.5"/><circle cx="60" cy="560" r="2.5"/><circle cx="60" cy="200" r="2.5"/>
  </g>

  <!-- waveform area fill -->
  <path d="M40 320 L140 320 L165 250 L190 320 L300 320 L330 430 L360 320 L470 320 L500 180 L530 320 L640 320 L665 400 L690 320 L800 320 L830 240 L855 320 L880 320
           L880 560 L40 560 Z" fill="url(#fadeL)"/>

  <!-- waveform stroke -->
  <path d="M40 320 L140 320 L165 250 L190 320 L300 320 L330 430 L360 320 L470 320 L500 180 L530 320 L640 320 L665 400 L690 320 L800 320 L830 240 L855 320 L880 320"
        fill="none" stroke="#005BAC" stroke-width="2" stroke-opacity="0.55" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- verdict markers at the peaks and dips -->
  <g>
    <circle cx="165" cy="250" r="5" fill="#17B26A"/><circle cx="165" cy="250" r="11" fill="none" stroke="#17B26A" stroke-opacity="0.3"/>
    <circle cx="500" cy="180" r="6" fill="#17B26A"/><circle cx="500" cy="180" r="14" fill="none" stroke="#17B26A" stroke-opacity="0.3"/>
    <circle cx="830" cy="240" r="5" fill="#17B26A"/><circle cx="830" cy="240" r="11" fill="none" stroke="#17B26A" stroke-opacity="0.3"/>
    <circle cx="330" cy="430" r="5" fill="#F04438"/><circle cx="330" cy="430" r="11" fill="none" stroke="#F04438" stroke-opacity="0.3"/>
    <circle cx="665" cy="400" r="5" fill="#F04438"/><circle cx="665" cy="400" r="11" fill="none" stroke="#F04438" stroke-opacity="0.3"/>
  </g>

  <!-- scan cursor -->
  <line x1="855" y1="150" x2="855" y2="580" stroke="#005BAC" stroke-opacity="0.28" stroke-dasharray="4 6"/>
  <circle cx="855" cy="320" r="4" fill="#005BAC" fill-opacity="0.6"/>

  <!-- scattered dots -->
  <g fill="#005BAC" fill-opacity="0.12">
    <circle cx="120" cy="120" r="2"/><circle cx="350" cy="90" r="2"/><circle cx="620" cy="120" r="2"/>
    <circle cx="760" cy="80" r="2"/><circle cx="220" cy="640" r="2"/><circle cx="520" cy="650" r="2"/>
  </g>
</svg>
