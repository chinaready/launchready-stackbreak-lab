name: evidence

# Collects mainland China reachability evidence: a curl/dig probe plus Playwright browser
# checks against the LIVE demos, commits the results, then refreshes the deployed site so
# the results volume reflects the new snapshot. Runs on the self-hosted mainland runner so
# the network vantage point is inside China. Only repo-defined env/vars are used in run steps.

on:
  schedule:
    - cron: '0 22 * * 0'   # Mondays 06:00 Asia/Shanghai (22:00 UTC Sunday)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evidence
  cancel-in-progress: false

env:
  PLAYWRIGHT_BASE_URL: https://stackbreak.launchready.cn
  CLOUD_PROVIDER: Alibaba Cloud
  CLOUD_REGION: ${{ vars.CLOUD_REGION }}
  RUNNER_HOST: launchready.cn
  EXPECT_BLOCKED: '1'
  DEPLOY_PATH: /opt/launchready-stackbreak-lab

jobs:
  collect:
    runs-on: [self-hosted, linux, mainland-china]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Network probe (curl + dig)
        run: ./probe/china-dependency-probe.sh

      - name: Install deps and browser checks
        run: |
          npm ci
          npx playwright install chromium
          npx playwright test || echo "browser checks reported failures (recorded in results)"

      - name: Refresh deployed site (local, no GitHub round-trip)
        run: |
          # Live container bind-mounts $DEPLOY_PATH/results read-only, so copying the freshly
          # generated results there updates stackbreak.launchready.cn/results/ immediately.
          # Done BEFORE the GitHub push so the live site stays current even when mainland
          # egress to github.com is throttled.
          mkdir -p "$DEPLOY_PATH/results"
          cp -a "$GITHUB_WORKSPACE/results/." "$DEPLOY_PATH/results/"

      - name: Publish results to GitHub (SSH over 443)
        run: |
          git config user.name "stackbreak-bot"
          git config user.email "bot@launchready.cn"
          git add results/
          if git diff --cached --quiet; then
            echo "no result changes"; exit 0
          fi
          git commit -m "[evidence] $(date +%F) mainland snapshot"
          # Mainland HTTPS to github.com uses GnuTLS and is reset by the GFW on larger pushes;
          # push over SSH-443 (ssh.github.com:443) via the runner deploy key, with retries.
          remote="git@github.com:chinaready/launchready-stackbreak-lab.git"
          n=0
          until [ "$n" -ge 5 ]; do
            if git push "$remote" HEAD:main; then echo "pushed to GitHub"; exit 0; fi
            n=$((n+1)); echo "push attempt $n failed; retrying in 10s"; sleep 10
          done
          echo "::error::git push to GitHub failed after 5 attempts (live site already refreshed)"
          exit 1
