name: deploy

# Redeploys the static site on the launchready.cn Docker host when site content changes
# on main. Runs on the self-hosted mainland runner at $DEPLOY_PATH. Git fetch uses SSH
# over port 443 — not HTTPS (unreliable from mainland China).

on:
  push:
    branches: [main]
    paths:
      - 'demos/**'
      - 'public/**'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - 'deploy/nginx.conf'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'llms.txt'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/launchready-stackbreak-lab
  GIT_REMOTE: git@github.com:chinaready/launchready-stackbreak-lab.git

jobs:
  deploy:
    runs-on: [self-hosted, linux, mainland-china]
    steps:
      - name: Pull and (re)build at deploy path
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          deploy_key="${HOME}/.ssh/github_deploy"
          if [ -f "$deploy_key" ]; then
            export GIT_SSH_COMMAND="ssh -i ${deploy_key} -o HostName=ssh.github.com -p 443 -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes"
          else
            export GIT_SSH_COMMAND="ssh -o HostName=ssh.github.com -p 443 -o StrictHostKeyChecking=accept-new"
          fi
          git remote set-url origin "$GIT_REMOTE"
          # Hard-sync to origin/main: probes sometimes leave stale tracked artifacts on this
          # host; reset --hard reconciles them. Gitignored files (.env, service-account creds)
          # are untouched.
          n=0
          until [ "$n" -ge 5 ]; do
            if git fetch --prune origin main; then break; fi
            n=$((n+1)); echo "fetch attempt $n failed; retrying in 10s"; sleep 10
          done
          if [ "$n" -ge 5 ]; then
            echo "::error::git fetch from GitHub failed after 5 attempts (SSH-443)"
            exit 1
          fi
          git reset --hard origin/main
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Smoke test (live URL)
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://stackbreak.launchready.cn/demos/ || true)
            if [ "$code" = "200" ]; then echo "demos OK"; break; fi
            echo "waiting for site ($code)..."; sleep 3
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' https://stackbreak.launchready.cn/demos/fonts-google.html)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://stackbreak.launchready.cn/results/latest.json)" = "200"
