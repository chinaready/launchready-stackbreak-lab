name: deploy

# Redeploys the static site on the launchready.cn Docker host when site content changes
# on main. Runs on the self-hosted mainland runner and operates on the deployment checkout
# at /opt/launchready-stackbreak-lab, integrating with the existing Traefik via
# docker-compose.prod.yml. No untrusted event input is used in run steps.

on:
  push:
    branches: [main]
    paths:
      - 'demos/**'
      - 'public/**'
      - 'Dockerfile'
      - 'docker-compose.prod.yml'
      - 'deploy/nginx.conf'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOY_PATH: /opt/launchready-stackbreak-lab

jobs:
  deploy:
    runs-on: [self-hosted, linux, mainland-china]
    steps:
      - name: Pull and (re)build at deploy path
        run: |
          cd "$DEPLOY_PATH"
          # Hard-sync to origin/main rather than ff-merge: probes are sometimes run
          # in place on this host (e.g. the Firebase kit), leaving untracked artifacts
          # at paths the repo later tracks, which makes `git pull --ff-only` abort.
          # reset --hard reconciles tracked paths to the remote and overwrites those
          # stale artifacts; gitignored files (.env, service-account creds) are untouched.
          #
          # Mainland egress to github.com is GFW-throttled and the HTTPS fetch can hang
          # or reset (see STATUS.md), so retry with a low-speed abort so a stalled
          # connect fails in ~30s instead of timing out after minutes.
          n=0
          until [ "$n" -ge 5 ]; do
            if git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch --prune origin main; then
              break
            fi
            n=$((n+1)); echo "fetch attempt $n failed; retrying in 10s"; sleep 10
          done
          if [ "$n" -ge 5 ]; then
            echo "::error::git fetch from GitHub failed after 5 attempts (mainland egress throttled)"
            exit 1
          fi
          git reset --hard origin/main
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Smoke test (live URL)
        run: |
          for i in $(seq 1 15); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://stackbreak.launchready.cn/demos/ || true)
            if [ "$code" = "200" ]; then echo "demos OK"; break; fi
            echo "waiting for site ($code)..."; sleep 3
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' https://stackbreak.launchready.cn/demos/fonts-google.html)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' https://stackbreak.launchready.cn/results/latest.json)" = "200"
